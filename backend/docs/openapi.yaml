      - name: search
        required: false
        in: query
        description: A search term.
        schema:
          type: string
      - in: query
        name: status
        schema:
          type: string
          enum:
          - cancelled
          - confirmed
          - delivered
          - packed
          - partial
          - pending
          - picking
          - shipped
        description: |-
          * `pending` - Pending
          * `confirmed` - Confirmed
          * `picking` - Picking
          * `packed` - Packed
          * `partial` - Partially shipped
          * `shipped` - Shipped
          * `delivered` - Delivered
          * `cancelled` - Cancelled
