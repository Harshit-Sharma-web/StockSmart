components:
  schemas:
    Assignment:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        user:
          type: integer
        location:
          type: integer
      required:
      - id
      - location
      - user
    Balance:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        location:
          type: integer
          readOnly: true
        product:
          type: integer
          readOnly: true
        on_hand:
          type: integer
          readOnly: true
        reserved:
          type: integer
          readOnly: true
        available:
          type: integer
          readOnly: true
        low_stock_threshold:
          type: integer
          readOnly: true
      required:
      - available
      - id
      - location
      - low_stock_threshold
      - on_hand
      - product
      - reserved
    Category:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        name:
          type: string
          maxLength: 120
        description:
          type: string
      required:
      - id
      - name
    ChangePassword:
      type: object
      properties:
        current_password:
          type: string
          writeOnly: true
        new_password:
          type: string
          writeOnly: true
      required:
      - current_password
      - new_password
    CreateOrder:
      type: object
      properties:
        location:
          type: integer
          minimum: 1
        client_key:
          type: string
          format: uuid
        items:
          type: array
          items:
            $ref: '#/components/schemas/LineInput'
      required:
      - items
      - location
    ImageWrite:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        url:
          type: string
          format: uri
          maxLength: 500
        alt_text:
          type: string
          maxLength: 150
        product:
          type: integer
      required:
      - id
      - product
      - url
    LineInput:
      type: object
      properties:
        product:
          type: integer
          minimum: 1
        quantity:
          type: integer
          maximum: 1000000
          minimum: 1
      required:
      - product
      - quantity
    Location:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        code:
          type: string
          maxLength: 32
        name:
          type: string
          maxLength: 150
        kind:
          $ref: '#/components/schemas/LocationKind'
        address:
          type: string
        active:
          type: boolean
      required:
      - code
      - id
      - kind
      - name
    LocationKind:
      enum:
      - store
      - warehouse
      type: string
      description: |-
        * `store` - Store
        * `warehouse` - Warehouse
    Logout:
      type: object
      properties:
        refresh:
          type: string
      required:
      - refresh
    Movement:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        location:
          type: integer
          readOnly: true
        product:
          type: integer
          readOnly: true
        kind:
          allOf:
          - $ref: '#/components/schemas/MovementKind'
          readOnly: true
        on_hand_delta:
          type: integer
          readOnly: true
        reserved_delta:
          type: integer
          readOnly: true
        on_hand_after:
          type: integer
          readOnly: true
        reserved_after:
          type: integer
          readOnly: true
        unit_cost:
          type: string
          format: decimal
          pattern: ^-?\d{0,10}(?:\.\d{0,2})?$
          readOnly: true
        actor:
          type: integer
          readOnly: true
        reference:
          type: string
          readOnly: true
        note:
          type: string
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - actor
      - created_at
      - id
      - kind
      - location
      - note
      - on_hand_after
      - on_hand_delta
      - product
      - reference
      - reserved_after
      - reserved_delta
      - unit_cost
    MovementInput:
      type: object
      properties:
        location:
          type: integer
          minimum: 1
        product:
          type: integer
          minimum: 1
        kind:
          $ref: '#/components/schemas/MovementInputKindEnum'
        quantity:
          type: integer
          maximum: 1000000
          minimum: -1000000
        note:
          type: string
          default: ''
          maxLength: 250
        scan:
          type: integer
          minimum: 1
      required:
      - kind
      - location
      - product
      - quantity
    MovementInputKindEnum:
      enum:
      - opening
      - receipt
      - adjustment
      - damage
      - loss
      type: string
      description: |-
        * `opening` - opening
        * `receipt` - receipt
        * `adjustment` - adjustment
        * `damage` - damage
        * `loss` - loss
    MovementKind:
      enum:
      - opening
      - receipt
      - adjustment
      - damage
      - loss
      - transfer_out
      - transfer_in
      - reserve
      - release
      - ship
      - return
      type: string
      description: |-
        * `opening` - Opening
        * `receipt` - Receipt
        * `adjustment` - Adjustment
        * `damage` - Damage
        * `loss` - Loss
        * `transfer_out` - Transfer out
        * `transfer_in` - Transfer in
        * `reserve` - Reserve
        * `release` - Release
        * `ship` - Ship
        * `return` - Verified return
    Order:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        customer:
          type: integer
        location:
          type: integer
        status:
          $ref: '#/components/schemas/OrderStatusEnum'
        total:
          type: string
          format: decimal
          pattern: ^-?\d{0,20}(?:\.\d{0,2})?$
        items:
          type: array
          items:
            $ref: '#/components/schemas/OrderLine'
        shipments:
          type: array
          items:
            $ref: '#/components/schemas/Shipment'
        returns:
          type: array
          items:
            $ref: '#/components/schemas/Return'
        created_at:
          type: string
          format: date-time
          readOnly: true
        confirmed_at:
