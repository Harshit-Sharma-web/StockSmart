    ScanInput:
      type: object
      properties:
        location:
          type: integer
          minimum: 1
        kind:
          $ref: '#/components/schemas/ScanKind'
        identifier:
          type: string
          maxLength: 80
        client_key:
          type: string
          format: uuid
        simulated:
          type: boolean
          default: false
      required:
      - client_key
      - identifier
      - kind
      - location
    ScanKind:
      enum:
      - barcode
      - rfid
      type: string
      description: |-
        * `barcode` - Barcode
        * `rfid` - RFID
    Shipment:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        tracking_number:
          type: string
          maxLength: 120
        shipped_at:
          type: string
          format: date-time
          readOnly: true
        items:
          type: array
          items:
            $ref: '#/components/schemas/ShipmentLine'
      required:
      - id
      - items
      - shipped_at
    ShipmentInput:
      type: object
      properties:
        client_key:
          type: string
          format: uuid
        tracking_number:
          type: string
          default: ''
          maxLength: 120
        items:
          type: array
          items:
            $ref: '#/components/schemas/LineInput'
      required:
      - client_key
    ShipmentLine:
      type: object
      properties:
        product:
          type: integer
        quantity:
          type: integer
          maximum: 4294967295
          minimum: 0
          format: int64
      required:
      - product
      - quantity
    StatusInput:
      type: object
      properties:
        status:
          $ref: '#/components/schemas/StatusInputStatusEnum'
      required:
      - status
    StatusInputStatusEnum:
      enum:
      - confirmed
      - picking
      - packed
      - delivered
      type: string
      description: |-
        * `confirmed` - confirmed
        * `picking` - picking
        * `packed` - packed
        * `delivered` - delivered
    Supplier:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        name:
          type: string
          maxLength: 150
        contact_name:
          type: string
          maxLength: 150
        email:
          oneOf:
          - type: string
            format: email
            maxLength: 254
          - type: string
            maxLength: 0
        phone:
          type: string
          maxLength: 50
        address:
          type: string
        active:
          type: boolean
      required:
      - id
      - name
    SupplierOffer:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        supplier:
          type: integer
        product:
          type: integer
        unit_cost:
          type: string
          format: decimal
          pattern: ^-?\d{0,10}(?:\.\d{0,2})?$
        lead_time_days:
          type: integer
          maximum: 4294967295
          minimum: 0
          format: int64
      required:
      - id
      - lead_time_days
      - product
      - supplier
      - unit_cost
    TokenObtainPair:
      type: object
      properties:
        username:
          type: string
          writeOnly: true
        password:
          type: string
          writeOnly: true
        access:
          type: string
          readOnly: true
        refresh:
          type: string
          readOnly: true
      required:
      - access
      - password
      - refresh
      - username
    TokenRefresh:
      type: object
      properties:
        access:
          type: string
          readOnly: true
        refresh:
          type: string
      required:
      - access
      - refresh
    Totals:
      type: object
      properties:
        on_hand:
          type: integer
        reserved:
          type: integer
        available:
          type: integer
      required:
      - available
      - on_hand
      - reserved
    Transfer:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        source:
          type: integer
          readOnly: true
        destination:
          type: integer
          readOnly: true
        status:
          allOf:
          - $ref: '#/components/schemas/TransferStatusEnum'
          readOnly: true
        items:
          type: array
          items:
            $ref: '#/components/schemas/TransferItem'
          readOnly: true
        created_by:
          type: integer
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        completed_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
      required:
      - completed_at
      - created_at
      - created_by
      - destination
      - id
      - items
      - source
      - status
    TransferInput:
      type: object
      properties:
        source:
          type: integer
          minimum: 1
        destination:
          type: integer
          minimum: 1
        items:
          type: array
          items:
            $ref: '#/components/schemas/TransferLineInput'
      required:
      - destination
      - items
      - source
    TransferItem:
      type: object
      properties:
        product:
          type: integer
        quantity:
          type: integer
          maximum: 4294967295
          minimum: 0
          format: int64
      required:
      - product
      - quantity
    TransferLineInput:
      type: object
      properties:
        product:
          type: integer
        quantity:
          type: integer
          maximum: 1000000
          minimum: 1
      required:
      - product
      - quantity
    TransferStatusEnum:
      enum:
      - pending
      - completed
      - cancelled
      type: string
      description: |-
        * `pending` - Pending
        * `completed` - Completed
        * `cancelled` - Cancelled
    UserAdmin:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        username:
          type: string
          readOnly: true
          description: Required. 150 characters or fewer. Letters, digits and @/./+/-/_
            only.
        email:
          title: Email address
          oneOf:
          - type: string
            format: email
            maxLength: 254
          - type: string
            maxLength: 0
        first_name:
          type: string
          maxLength: 150
        last_name:
          type: string
          maxLength: 150
        role:
          $ref: '#/components/schemas/RoleEnum'
        is_active:
          type: boolean
          title: Active
          description: Designates whether this user should be treated as active. Unselect
            this instead of deleting accounts.
      required:
      - id
      - username
  securitySchemes:
    jwtAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
